services:
  oracle-db:
    image: gvenzl/oracle-free:slim
    container_name: zerq_oracle
    restart: unless-stopped
    ports:
      - "1521:1521"   # Oracle TNS listener
      - "5500:5500"   # Oracle Enterprise Manager Express (optional)
    environment:
      # These environment variables are read by the gvenzl image on first boot
      ORACLE_PASSWORD: ZeroQ_Admin1           # SYS / SYSTEM password
      APP_USER: zerq_app                      # Application schema user
      APP_USER_PASSWORD: ZeroQ_App1           # Application schema password
    volumes:
      # Persist Oracle data files across container restarts
      - oracle_data:/opt/oracle/oradata
      # Mount 01_init.sh to container to run automatically on first startup
      - ./db/01_init.sh:/container-entrypoint-initdb.d/01_init.sh:ro
      # Mount schema.sql file to run by 01_init.sh
      - ./db/schema.sql:/opt/oracle/scripts/schema.sql:ro
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "zerq_app/ZeroQ_App1@//localhost:1521/FREEPDB1",
             "@/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s   # Oracle Free needs up to 2 min to fully initialise

volumes:
  oracle_data:
    driver: local
